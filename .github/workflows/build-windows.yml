name: Build WINQ-EMU (Windows x64)

on:
  push:
    branches: [alpha10, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winq-emu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    env:
      # Keep these versions in sync with the launcher / installer sources.
      VIRGL_REF: alpha10
      QEMU_REF: alpha10

    steps:
      - name: Check out launcher and installer
        uses: actions/checkout@v4

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git diffutils zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-nsis

      - name: Fetch matching virglrenderer and QEMU forks
        run: |
          set -euo pipefail
          mkdir -p _deps
          git clone --depth 1 --branch "$VIRGL_REF" \
            https://github.com/cmspam/winq-emu-virglrenderer.git _deps/virglrenderer
          git clone --depth 1 --branch "$QEMU_REF" \
            https://github.com/cmspam/winq-emu-qemu.git _deps/qemu
          echo "virglrenderer commit: $(git -C _deps/virglrenderer rev-parse HEAD)"
          echo "QEMU commit: $(git -C _deps/qemu rev-parse HEAD)"

      - name: Build and install virglrenderer (Venus + D3D11 video)
        run: |
          set -euo pipefail
          cd _deps/virglrenderer
          meson setup builddir --prefix=/ucrt64 \
            -Dvenus=true -Dvideo=true -Dtests=false
          ninja -C builddir
          ninja -C builddir install
          test -f /ucrt64/bin/libvirglrenderer-1.dll

      - name: Build and install WINQ-EMU QEMU
        run: |
          set -euo pipefail
          cd _deps/qemu
          bash build.sh
          ninja -C build install
          test -f build/qemu-system-x86_64.exe
          test -d /ucrt64/share/qemu

      - name: Compile Windows Forms launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "C# compiler not found: $csc" }
          & $csc '/nologo' '/target:winexe' `
            '/out:installer\WINQ-EMU.exe' `
            '/win32icon:launcher\winq-emu.ico' `
            '/r:System.Windows.Forms.dll' '/r:System.Drawing.dll' `
            'launcher\WINQ-EMU.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'installer\WINQ-EMU.exe')) {
            throw 'Windows launcher was not produced'
          }

      - name: Stage QEMU, firmware, and recursive UCRT64 DLL dependencies
        run: |
          set -euo pipefail
          mkdir -p installer/bin/share installer/icons
          cp launcher/winq-emu.ico installer/icons/winq-emu.ico

          # Source binary names are mandated by installer/installer.nsi.
          for exe in qemu-system-x86_64.exe qemu-system-x86_64w.exe qemu-img.exe; do
            if [[ -f "_deps/qemu/build/$exe" ]]; then
              cp "_deps/qemu/build/$exe" installer/bin/
            elif [[ -f "/ucrt64/bin/$exe" ]]; then
              cp "/ucrt64/bin/$exe" installer/bin/
            else
              echo "Required QEMU binary missing: $exe" >&2
              exit 1
            fi
          done
          cp /ucrt64/bin/libvirglrenderer-1.dll installer/bin/
          cp -a /ucrt64/share/qemu/. installer/bin/share/

          # Inspect PE import tables rather than relying on a hard-coded
          # C:\msys64 path or executing binaries with ldd. Copy only DLLs
          # actually available under the UCRT64 prefix (not Windows DLLs).
          declare -A scanned=()
          collect_deps() {
            local binary="$1" dll lower found
            while IFS= read -r dll; do
              lower="${dll,,}"
              [[ -n "${scanned[$lower]:-}" ]] && continue
              scanned[$lower]=1
              found="$(find /ucrt64/bin -maxdepth 1 -type f -iname "$dll" -print -quit)"
              if [[ -n "$found" ]]; then
                cp -n "$found" installer/bin/
                collect_deps "$found"
              fi
            done < <(objdump -p "$binary" | sed -nE \
              's/^[[:space:]]*DLL Name:[[:space:]]*([^[:space:]]+).*/\1/p')
          }
          for binary in installer/bin/*.exe installer/bin/*.dll; do
            collect_deps "$binary"
          done

          # The installer explicitly requires BIOS ROMs and keymaps.
          compgen -G 'installer/bin/share/*.bin' >/dev/null
          compgen -G 'installer/bin/share/*.rom' >/dev/null
          test -d installer/bin/share/keymaps
          compgen -G 'installer/bin/share/keymaps/*' >/dev/null
          echo "Packaged $(find installer/bin -iname '*.dll' | wc -l) DLLs"

      - name: Smoke test assembled executables (no GPU/VM required)
        run: |
          set -euo pipefail
          export PATH="$PWD/installer/bin:$PATH"
          installer/bin/qemu-system-x86_64.exe --version
          installer/bin/qemu-img.exe --version
          installer/bin/qemu-system-x86_64.exe -accel help > accelerators.txt
          grep -qi whpx accelerators.txt
          installer/bin/qemu-system-x86_64.exe -device help > devices.txt
          grep -q 'virtio-vga-gl' devices.txt

      - name: Create portable ZIP and NSIS installer
        run: |
          set -euo pipefail
          mkdir -p dist/WINQ-EMU/vm
          cp -a installer/bin dist/WINQ-EMU/
          cp installer/WINQ-EMU.exe installer/launch-vm.bat \
             installer/README.txt installer/LICENSE.txt dist/WINQ-EMU/
          cp installer/icons/winq-emu.ico dist/WINQ-EMU/winq-emu.ico
          printf '%s\n' \
            "GUI: ${GITHUB_SHA}" \
            "QEMU: $(git -C _deps/qemu rev-parse HEAD)" \
            "virglrenderer: $(git -C _deps/virglrenderer rev-parse HEAD)" \
            > dist/WINQ-EMU/BUILD-INFO.txt
          printf '%s\n' 'Put your Linux qcow2 image here as disk.qcow2.' \
            > dist/WINQ-EMU/vm/README.txt
          (cd dist && zip -qr WINQ-EMU-Alpha10-Portable.zip WINQ-EMU)
          (cd installer && makensis installer.nsi)
          test -s WINQ-EMU-Alpha10-Setup.exe
          test -s dist/WINQ-EMU-Alpha10-Portable.zip

      - name: Upload portable distribution
        uses: actions/upload-artifact@v4
        with:
          name: WINQ-EMU-Alpha10-Portable
          path: dist/WINQ-EMU-Alpha10-Portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: WINQ-EMU-Alpha10-Installer
          path: WINQ-EMU-Alpha10-Setup.exe
          if-no-files-found: error
          retention-days: 14
